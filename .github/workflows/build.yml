name: Build Android Release

on:
  workflow_dispatch: # Allows you to trigger the build manually with one click

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Upload Keystore
        run: |
          keytool -genkeypair -v -keystore my-upload-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -storepass MySecretPass123! -keypass MySecretPass123! \
            -dname "CN=TaskEasy, OU=Dev, O=TaskEasy, L=City, S=State, C=US"

      - name: Build AAB and APK
        env:
          STORE_PASSWORD: "MySecretPass123!"
          KEY_PASSWORD: "MySecretPass123!"
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease :app:assembleDebug

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK (Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
