name: Build Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set Up Keystores
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Using persistent upload keystore from GitHub Secrets."
          else
            echo "::warning::UPLOAD_KEYSTORE_BASE64 secret not set. Generating a temporary keystore (add Secrets before Play Store updates so app signatures match)."
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload -storepass MySecretPass123! -keypass MySecretPass123! \
              -dname "CN=TaskEasy, OU=Dev, O=TaskEasy, L=City, S=State, C=US"
          fi

          # Debug keystore
          keytool -genkeypair -v -keystore debug.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Build AAB Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'MySecretPass123!' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'MySecretPass123!' }}
        run: |
          gradle :app:bundleRelease

      - name: Build APK
        run: |
          gradle :app:assembleDebug

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK (Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
